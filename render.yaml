# Render Blueprint: 백엔드(NestJS) Web Service 한 개.
# DB는 이미 만들어 둔 Render PostgreSQL을 쓴다(새로 만들지 않음). 값은 대시보드에서 직접 입력한다.
services:
  - type: web
    name: heuk-backend
    runtime: node
    plan: free
    region: singapore
    # pnpm 워크스페이스라 저장소 루트에서 설치·빌드한다.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter backend build
    # 시작 전에 마이그레이션을 적용한다(무료 플랜은 preDeployCommand 없음).
    startCommand: pnpm --filter backend db:deploy && pnpm --filter backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL # Render PostgreSQL 링크 + ?schema=hackathon&sslmode=require
        sync: false
      - key: CORS_ORIGIN # Vercel 주소 (예: https://xxx.vercel.app)
        sync: false
      - key: FRONTEND_URL # 직원 초대 링크용, 보통 CORS_ORIGIN과 같은 값
        sync: false
      - key: RESEND_API_KEY # 비워도 됨(초대 링크만 화면에 표시)
        sync: false
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: OPENAI_API_KEY # 질문하기(RAG)용. 값은 대시보드에서 직접 입력
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
